[package]
name = "homework-client"
version = "0.1.0"
edition = "2021"
description = "每日作业客户端：班级作业/公告/演讲提醒的编辑与放映工具"

[[bin]]
name = "homework-client"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.32", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fontdue = "0.9"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
