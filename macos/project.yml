name: HomeworkMac
options:
  bundleIdPrefix: local.zyh
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  HomeworkKit:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_OBJC_ARC: "YES"
    DEAD_CODE_STRIPPING: "YES"

targets:
  HomeworkApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/HomeworkMac
      - path: Resources/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: HomeworkKit
        product: HomeworkKit
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 每日作业
        CFBundleIconFile: AppIcon
        CFBundleDevelopmentRegion: zh_CN
        LSMinimumSystemVersion: "26.0"
        LSApplicationCategoryType: public.app-category.education
        NSHighResolutionCapable: true
        NSSupportsAutomaticTermination: false
        NSHumanReadableCopyright: 南京市鼓楼区班级「每日作业」
        NSCalendarsUsageDescription: 读取系统日历中的「中国大陆节假日」，用于识别法定节假日与调休上课日
        NSCalendarsFullAccessUsageDescription: 读取系统日历中的「中国大陆节假日」，用于识别法定节假日与调休上课日
    entitlements:
      path: Support/HomeworkMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_NAME: 每日作业
        PRODUCT_BUNDLE_IDENTIFIER: local.zyh.homework
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
